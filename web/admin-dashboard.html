{% extends "base-dashboard.html" %}

{% block title %}Пользователи{% endblock %}
{% block content %}
<script>
    async function loadUsers() {
        try {
            const response = await fetch('/api/admin/users/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('usersTableBody');
            
            if (!data.users || data.users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Пользователей пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.user_id}</td>
                    <td>${user.login}</td>
                    <td>${user.role}</td>
                    <td>${user.is_blocked ? '<span class="badge badge-danger">Заблокирован</span>' : '<span class="badge badge-success">Активен</span>'}</td>
                    <td>${user.failed_attempts}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick='editUser(${user.user_id}, \'${user.login}\', \'${user.role}\')'>✏️</button>
                        ${!user.is_blocked ?
                            `<button class="btn btn-sm btn-outline" onclick="blockUser(${user.user_id})">🔒</button>` :
                            `<button class="btn btn-sm btn-success" onclick="unblockUser(${user.user_id})">🔓</button>`
                        }
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.user_id})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить пользователей');
        }
    }

    function openAddUserModal() {
        document.getElementById('modalTitle').textContent = 'Добавить пользователя';
        document.getElementById('editUserId').value = '';
        document.getElementById('modalLogin').value = '';
        document.getElementById('modalPassword').value = '';
        document.getElementById('modalRole').value = 'Пользователь';
        document.getElementById('modalPassword').required = true;
        openModal('userModal');
    }

    function editUser(userId, login, role) {
        document.getElementById('modalTitle').textContent = 'Редактировать пользователя';
        document.getElementById('editUserId').value = userId;
        document.getElementById('modalLogin').value = login;
        document.getElementById('modalPassword').value = '';
        document.getElementById('modalPassword').required = false;
        document.getElementById('modalRole').value = role;
        openModal('userModal');
    }

    async function saveUser(event) {
        event.preventDefault();
        const userId = document.getElementById('editUserId').value;
        const login = document.getElementById('modalLogin').value;
        const password = document.getElementById('modalPassword').value;
        const role = document.getElementById('modalRole').value;

        const data = { login: login, role: role };
        if (password) data.password = password;

        const url = userId ? `/api/admin/users/${userId}` : '/api/admin/users/';
        
        try {
            const response = await fetch(url, {
                method: userId ? 'PUT' : 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            closeModal('userModal');
            loadUsers();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function unblockUser(userId) {
        try {
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_blocked: false })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Пользователь разблокирован');
            loadUsers();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function blockUser(userId) {
        try {
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_blocked: true })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Пользователь заблокирован');
            loadUsers();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteUser(userId) {
        if (!confirm('Вы уверены, что хотите удалить этого пользователя?')) return;
        try {
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Пользователь удалён');
            loadUsers();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
</script>
<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список пользователей</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddUserModal()">+ Добавить пользователя</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Роль</th>
                <th>Статус</th>
                <th>Попытки</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr><td colspan="6" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="userModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить пользователя</h3>
            <button class="modal-close" onclick="closeModal('userModal')">&times;</button>
        </div>
        <form id="userForm" onsubmit="saveUser(event)">
            <input type="hidden" id="editUserId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Логин <span class="required">*</span></label>
                    <input type="text" id="modalLogin" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль <span class="required">*</span></label>
                    <input type="password" id="modalPassword" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Роль</label>
                    <select id="modalRole" class="form-input">
                        <option value="Пользователь">Пользователь</option>
                        <option value="Администратор">Администратор</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('userModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
