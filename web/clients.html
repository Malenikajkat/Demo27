{% extends "base-dashboard.html" %}

{% block title %}Клиенты{% endblock %}
{% block content %}
<script>
    async function loadClients() {
        try {
            const response = await fetch('/api/clients/', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            if (!response.ok) throw new Error('Network error');
            const data = await response.json();
            const tbody = document.getElementById('clientsTableBody');
            
            if (!data.clients || data.clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Клиентов пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.clients.forEach(client => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${client.client_id.substring(0, 8)}...</td>
                    <td>${client.name}</td>
                    <td>${client.inn || '—'}</td>
                    <td><span class="badge badge-${client.client_type === 'Поставщик' ? 'info' : 'success'}">${client.client_type}</span></td>
                    <td>${client.phone || '—'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick='editClient(${JSON.stringify(client)})'>✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteClient('${client.client_id}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить данные');
        }
    }

    function openAddClientModal() {
        document.getElementById('modalTitle').textContent = 'Добавить клиента';
        document.getElementById('editClientId').value = '';
        document.getElementById('clientForm').reset();
        openModal('clientModal');
    }

    function editClient(client) {
        document.getElementById('modalTitle').textContent = 'Редактировать клиента';
        document.getElementById('editClientId').value = client.client_id;
        document.getElementById('clientName').value = client.name || '';
        document.getElementById('clientInn').value = client.inn || '';
        document.getElementById('clientAddress').value = client.address || '';
        document.getElementById('clientPhone').value = client.phone || '';
        document.getElementById('clientType').value = client.client_type || 'Поставщик';
        openModal('clientModal');
    }

    async function saveClient(event) {
        event.preventDefault();
        const clientId = document.getElementById('editClientId').value;
        const data = {
            name: document.getElementById('clientName').value,
            inn: document.getElementById('clientInn').value,
            address: document.getElementById('clientAddress').value,
            phone: document.getElementById('clientPhone').value,
            client_type: document.getElementById('clientType').value
        };

        const url = clientId ? `/api/clients/${clientId}` : '/api/clients/';
        const method = clientId ? 'PUT' : 'POST';
        
        try {
            const response = await fetch(url, {
                method: method,
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            closeModal('clientModal');
            loadClients();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteClient(clientId) {
        if (!confirm('Вы уверены, что хотите удалить этого клиента?')) return;
        try {
            const response = await fetch(`/api/clients/${clientId}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            loadClients();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadClients);
</script>
<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список клиентов</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddClientModal()">+ Добавить клиента</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>ИНН</th>
                <th>Тип</th>
                <th>Телефон</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="clientsTableBody">
            <tr><td colspan="6" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="clientModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить клиента</h3>
            <button class="modal-close" onclick="closeModal('clientModal')">&times;</button>
        </div>
        <form id="clientForm" onsubmit="saveClient(event)">
            <input type="hidden" id="editClientId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Название <span class="required">*</span></label>
                    <input type="text" id="clientName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ИНН</label>
                    <input type="text" id="clientInn" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Адрес</label>
                    <input type="text" id="clientAddress" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="text" id="clientPhone" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Тип <span class="required">*</span></label>
                    <select id="clientType" class="form-input" required>
                        <option value="Поставщик">Поставщик</option>
                        <option value="Покупатель">Покупатель</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('clientModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
