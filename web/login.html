<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — Производственная ИС</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* --- Puzzle captcha styles --- */
        .puzzle-captcha-section {
            background: var(--color-background);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
        }

        .puzzle-captcha-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .puzzle-captcha-icon {
            font-size: 24px;
        }

        .puzzle-captcha-title {
            font-weight: 600;
            font-size: 16px;
        }

        .puzzle-captcha-instruction {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 12px;
        }

        /* Grid 2×2 */
        .puzzle-grid {
            display: grid;
            grid-template-columns: 150px 150px;
            grid-template-rows: 150px 150px;
            gap: 4px;
            width: fit-content;
            margin: 0 auto 16px auto;
        }

        .puzzle-cell {
            width: 150px;
            height: 150px;
            border: 2px dashed #bbb;
            border-radius: 4px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, background 0.2s;
        }

        .puzzle-cell.over {
            border-color: #2563eb;
            background: rgba(37, 99, 235, 0.1);
        }

        .puzzle-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
            pointer-events: none;
        }

        .puzzle-cell .cell-number {
            font-size: 24px;
            font-weight: 700;
            color: #cbd5e1;
            user-select: none;
        }

        /* Tray */
        .puzzle-tray {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 80px;
            padding: 8px;
            background: #f1f5f9;
            border-radius: 6px;
        }

        .puzzle-tray img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: grab;
            border: 2px solid #ddd;
            border-radius: 4px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .puzzle-tray img:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .puzzle-tray img:active {
            cursor: grabbing;
        }

        .puzzle-tray img.dragging {
            opacity: 0.4;
        }

        /* Status */
        .puzzle-status {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            margin-top: 8px;
            min-height: 20px;
        }

        .puzzle-status.ok { color: #16a34a; }
        .puzzle-status.err { color: #dc2626; }
    </style>
</head>
<body>
    <div id="notificationContainer" class="notification-container"></div>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">ПИС</div>
                <h1 class="auth-title">Производственная ИС</h1>
                <p class="auth-subtitle">Войдите в систему для продолжения работы</p>
            </div>

            {% if error_message %}
            <div class="error-message">
                <span class="error-icon">⚠</span>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <form id="authorizationForm" method="POST" action="/" novalidate>
                <!-- Скрытые поля для порядка кусков в каждой клетке -->
                <input type="hidden" name="order" id="order0" value="">
                <input type="hidden" name="order" id="order1" value="">
                <input type="hidden" name="order" id="order2" value="">
                <input type="hidden" name="order" id="order3" value="">

                <div class="puzzle-captcha-section">
                    <div class="puzzle-captcha-header">
                        <div class="puzzle-captcha-icon">🧩</div>
                        <span class="puzzle-captcha-title">Подтвердите, что вы человек</span>
                    </div>
                    <p class="puzzle-captcha-instruction">
                        Перетащите куски из нижней панели в клетки 2×2 в правильном порядке
                    </p>

                    <!-- Сетка 2×2 -->
                    <div class="puzzle-grid">
                        <div class="puzzle-cell">
                            <span class="cell-number">?</span>
                        </div>
                        <div class="puzzle-cell">
                            <span class="cell-number">?</span>
                        </div>
                        <div class="puzzle-cell">
                            <span class="cell-number">?</span>
                        </div>
                        <div class="puzzle-cell">
                            <span class="cell-number">?</span>
                        </div>
                    </div>

                    <!-- Лоток с кусками -->
                    <div class="puzzle-tray" id="puzzleTray">
                        <img src="/image/1.png" data-index="0" alt="Piece 0">
                        <img src="/image/2.png" data-index="1" alt="Piece 1">
                        <img src="/image/3.png" data-index="2" alt="Piece 2">
                        <img src="/image/4.png" data-index="3" alt="Piece 3">
                    </div>

                    <div class="puzzle-status" id="puzzleStatus">
                        Расставьте фрагменты по клеткам
                    </div>
                </div>

                <!-- Поля логина/пароля -->
                <div class="form-group">
                    <label for="loginInput" class="form-label">
                        Логин <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="loginInput"
                        name="login"
                        class="form-input"
                        placeholder="Введите ваш логин"
                        value="{{ login if puzzle_solved else '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="passwordInput" class="form-label">
                        Пароль <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="passwordInput"
                        name="password"
                        class="form-input"
                        placeholder="Введите ваш пароль"
                        required
                    >
                </div>

                <button type="submit" id="loginButton" class="btn btn-primary btn-full">
                    Войти
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- Drag & Drop ---
        let draggedDataIndex = null;

        function dragStart(e) {
            draggedDataIndex = e.target.getAttribute('data-index');
            e.dataTransfer.setData('text/plain', draggedDataIndex);
            e.dataTransfer.effectAllowed = 'move';
            e.target.style.opacity = '0.4';
        }

        function dragEnd(e) {
            e.target.style.opacity = '1';
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('over');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('over');
        }

        function drop(e) {
            e.preventDefault();

            const dataIndex = e.dataTransfer.getData('text/plain');
            if (!dataIndex) return;

            // Определяем, куда бросили
            const target = e.target;
            const cell = target.closest('.puzzle-cell');
            const tray = target.closest('#puzzleTray');

            if (cell) {
                dropInCell(cell, dataIndex);
            } else if (tray) {
                dropInTray(tray, dataIndex);
            }
        }

        function dropInCell(cell, dataIndex) {
            // Получаем индекс клетки (0, 1, 2, или 3)
            const cells = document.querySelectorAll('.puzzle-cell');
            let cellIndex = -1;
            cells.forEach((c, i) => {
                if (c === cell) cellIndex = i;
            });

            // Если в клетке уже есть картинка - возвращаем её в лоток
            const existingImg = cell.querySelector('img');
            if (existingImg) {
                returnToTrayByIndex(existingImg.getAttribute('data-index'));
            }

            // Создаём новую картинку в клетке
            const num = parseInt(dataIndex, 10) + 1;
            cell.innerHTML =
                '<img src="/image/' + num + '.png" ' +
                'data-index="' + dataIndex + '" alt="Piece ' + dataIndex + '" ' +
                'draggable="true" ondragstart="dragStart(event)" ondragend="dragEnd(event)">';

            // Обновляем скрытое поле orderN
            if (cellIndex >= 0) {
                const hiddenField = document.getElementById('order' + cellIndex);
                if (hiddenField) {
                    hiddenField.value = dataIndex;
                }
            }

            updateStatus();
        }

        function dropInTray(target, dataIndex) {
            // Возвращаем картинку в лоток
            returnToTrayByIndex(dataIndex);
        }

        function returnToTrayByIndex(dataIndex) {
            const tray = document.getElementById('puzzleTray');

            // Проверяем, есть ли уже такая картинка в лотке
            const existingInTray = tray.querySelector('img[data-index="' + dataIndex + '"]');
            if (existingInTray) {
                // Если есть - ничего не делаем (картинка уже в лотке)
                return;
            }

            // Создаём картинку в лотке
            const num = parseInt(dataIndex, 10) + 1;
            const img = document.createElement('img');
            img.src = '/image/' + num + '.png';
            img.setAttribute('data-index', dataIndex);
            img.setAttribute('alt', 'Piece ' + dataIndex);
            img.setAttribute('draggable', 'true');
            img.addEventListener('dragstart', dragStart);
            img.addEventListener('dragend', dragEnd);
            tray.appendChild(img);

            // Очищаем скрытое поле, если картинка возвращается из клетки
            const cells = document.querySelectorAll('.puzzle-cell');
            cells.forEach((cell, cellIndex) => {
                const cellImg = cell.querySelector('img');
                if (cellImg && cellImg.getAttribute('data-index') === dataIndex) {
                    const hiddenField = document.getElementById('order' + cellIndex);
                    if (hiddenField) {
                        hiddenField.value = '';
                    }
                }
            });
        }

        function updateStatus() {
            const cells = document.querySelectorAll('.puzzle-cell');
            let order = [];
            let filled = 0;

            cells.forEach((cell, i) => {
                const img = cell.querySelector('img');
                if (img) {
                    order.push(img.getAttribute('data-index'));
                    filled++;
                } else {
                    order.push('-1');
                }
            });

            const status = document.getElementById('puzzleStatus');

            if (filled === 0) {
                status.textContent = 'Расставьте фрагменты по клеткам';
                status.className = 'puzzle-status';
            } else if (order.join(',') === '0,1,2,3') {
                status.textContent = '✓ Пазл собран верно!';
                status.className = 'puzzle-status ok';
            } else {
                status.textContent = '✗ Неправильный порядок, попробуйте ещё раз';
                status.className = 'puzzle-status err';
            }
        }

        // Инициализация - добавляем обработчики для лотка
        document.addEventListener('DOMContentLoaded', function() {
            const tray = document.getElementById('puzzleTray');
            const cells = document.querySelectorAll('.puzzle-cell');
            
            if (tray) {
                tray.addEventListener('dragover', dragOver);
                tray.addEventListener('dragleave', dragLeave);
                tray.addEventListener('drop', drop);

                // Добавляем обработчики для картинок в лотке
                tray.querySelectorAll('img').forEach(function(img) {
                    img.setAttribute('draggable', 'true');
                    img.addEventListener('dragstart', dragStart);
                    img.addEventListener('dragend', dragEnd);
                });
            }

            // Добавляем обработчики для клеток
            cells.forEach(function(cell) {
                cell.addEventListener('dragover', dragOver);
                cell.addEventListener('dragleave', dragLeave);
                cell.addEventListener('drop', drop);
            });
        });
    </script>
</body>
</html>
