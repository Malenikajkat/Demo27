{% extends "base-dashboard.html" %}

{% block title %}Материалы{% endblock %}
{% block content %}
<script>
    async function loadMaterials() {
        try {
            const response = await fetch('/api/materials/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('materialsTableBody');
            
            if (!data.materials || data.materials.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Материалов пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.materials.forEach(material => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${material.material_id.substring(0, 8)}...</td>
                    <td>${material.name}</td>
                    <td>${material.code}</td>
                    <td>${material.created_at ? new Date(material.created_at).toLocaleDateString('ru-RU') : '—'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick='editMaterial(${JSON.stringify(material)})'>✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteMaterial('${material.material_id}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить данные');
        }
    }

    function openAddMaterialModal() {
        document.getElementById('modalTitle').textContent = 'Добавить материал';
        document.getElementById('editMaterialId').value = '';
        document.getElementById('materialForm').reset();
        openModal('materialModal');
    }

    function editMaterial(material) {
        document.getElementById('modalTitle').textContent = 'Редактировать материал';
        document.getElementById('editMaterialId').value = material.material_id;
        document.getElementById('materialName').value = material.name || '';
        document.getElementById('materialCode').value = material.code || '';
        openModal('materialModal');
    }

    async function saveMaterial(event) {
        event.preventDefault();
        const materialId = document.getElementById('editMaterialId').value;
        const data = {
            name: document.getElementById('materialName').value,
            code: document.getElementById('materialCode').value
        };

        const url = materialId ? `/api/materials/${materialId}` : '/api/materials/';
        
        try {
            const response = await fetch(url, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            closeModal('materialModal');
            loadMaterials();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteMaterial(materialId) {
        if (!confirm('Вы уверены, что хотите удалить этот материал?')) return;
        try {
            const response = await fetch(`/api/materials/${materialId}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            loadMaterials();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadMaterials);
</script>
<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список материалов</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddMaterialModal()">+ Добавить материал</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Код</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="materialsTableBody">
            <tr><td colspan="5" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="materialModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить материал</h3>
            <button class="modal-close" onclick="closeModal('materialModal')">&times;</button>
        </div>
        <form id="materialForm" onsubmit="saveMaterial(event)">
            <input type="hidden" id="editMaterialId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Название <span class="required">*</span></label>
                    <input type="text" id="materialName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Код <span class="required">*</span></label>
                    <input type="text" id="materialCode" class="form-input" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('materialModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
