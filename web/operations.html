{% extends "base-dashboard.html" %}

{% block title %}Операции{% endblock %}
{% block content %}
<script>
    async function loadOperations() {
        try {
            const response = await fetch('/api/operations/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('operationsTableBody');
            
            if (!data.operations || data.operations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Операций пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.operations.forEach(operation => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${operation.operation_id.substring(0, 8)}...</td>
                    <td>${operation.name}</td>
                    <td>${operation.code}</td>
                    <td>${operation.created_at ? new Date(operation.created_at).toLocaleDateString('ru-RU') : '—'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick='editOperation(${JSON.stringify(operation)})'>✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteOperation('${operation.operation_id}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить данные');
        }
    }

    function openAddOperationModal() {
        document.getElementById('modalTitle').textContent = 'Добавить операцию';
        document.getElementById('editOperationId').value = '';
        document.getElementById('operationForm').reset();
        openModal('operationModal');
    }

    function editOperation(operation) {
        document.getElementById('modalTitle').textContent = 'Редактировать операцию';
        document.getElementById('editOperationId').value = operation.operation_id;
        document.getElementById('operationName').value = operation.name || '';
        document.getElementById('operationCode').value = operation.code || '';
        openModal('operationModal');
    }

    async function saveOperation(event) {
        event.preventDefault();
        const operationId = document.getElementById('editOperationId').value;
        const data = {
            name: document.getElementById('operationName').value,
            code: document.getElementById('operationCode').value
        };

        const url = operationId ? `/api/operations/${operationId}` : '/api/operations/';
        
        try {
            const response = await fetch(url, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            closeModal('operationModal');
            loadOperations();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteOperation(operationId) {
        if (!confirm('Вы уверены, что хотите удалить эту операцию?')) return;
        try {
            const response = await fetch(`/api/operations/${operationId}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            loadOperations();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadOperations);
</script>
<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список операций</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddOperationModal()">+ Добавить операцию</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Код</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="operationsTableBody">
            <tr><td colspan="5" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="operationModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить операцию</h3>
            <button class="modal-close" onclick="closeModal('operationModal')">&times;</button>
        </div>
        <form id="operationForm" onsubmit="saveOperation(event)">
            <input type="hidden" id="editOperationId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Название <span class="required">*</span></label>
                    <input type="text" id="operationName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Код <span class="required">*</span></label>
                    <input type="text" id="operationCode" class="form-input" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('operationModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
