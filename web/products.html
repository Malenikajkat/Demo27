{% extends "base-dashboard.html" %}

{% block title %}Продукция{% endblock %}
{% block content %}
<script>
    async function loadProducts() {
        try {
            const response = await fetch('/api/products/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('productsTableBody');
            
            if (!data.products || data.products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Продукции пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.products.forEach(product => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${product.product_id.substring(0, 8)}...</td>
                    <td>${product.name}</td>
                    <td>${product.code}</td>
                    <td>${product.created_at ? new Date(product.created_at).toLocaleDateString('ru-RU') : '—'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick='editProduct(${JSON.stringify(product)})'>✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct('${product.product_id}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить данные');
        }
    }

    function openAddProductModal() {
        document.getElementById('modalTitle').textContent = 'Добавить продукцию';
        document.getElementById('editProductId').value = '';
        document.getElementById('productForm').reset();
        openModal('productModal');
    }

    function editProduct(product) {
        document.getElementById('modalTitle').textContent = 'Редактировать продукцию';
        document.getElementById('editProductId').value = product.product_id;
        document.getElementById('productName').value = product.name || '';
        document.getElementById('productCode').value = product.code || '';
        openModal('productModal');
    }

    async function saveProduct(event) {
        event.preventDefault();
        const productId = document.getElementById('editProductId').value;
        const data = {
            name: document.getElementById('productName').value,
            code: document.getElementById('productCode').value
        };

        const url = productId ? `/api/products/${productId}` : '/api/products/';
        const method = productId ? 'PUT' : 'POST';
        
        try {
            const response = await fetch(url, {
                method: method,
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            closeModal('productModal');
            loadProducts();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    async function deleteProduct(productId) {
        if (!confirm('Вы уверены, что хотите удалить эту продукцию?')) return;
        try {
            const response = await fetch(`/api/products/${productId}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Операция выполнена');
            loadProducts();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
</script>
<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список продукции</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddProductModal()">+ Добавить продукцию</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Код</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="productsTableBody">
            <tr><td colspan="5" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="productModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить продукцию</h3>
            <button class="modal-close" onclick="closeModal('productModal')">&times;</button>
        </div>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="editProductId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Название <span class="required">*</span></label>
                    <input type="text" id="productName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Код <span class="required">*</span></label>
                    <input type="text" id="productCode" class="form-input" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('productModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
