{% extends "base-dashboard.html" %}

{% block title %}Заказы покупателей{% endblock %}
{% block content %}
<script>
    async function loadOrders() {
        try {
            const response = await fetch('/api/sales-orders/', { credentials: 'include' });
            const data = await response.json();
            const tbody = document.getElementById('ordersTableBody');
            
            if (!data.sales_orders || data.sales_orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Заказов пока нет</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.sales_orders.forEach(order => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${order.order_number}</td>
                    <td>${order.order_date ? new Date(order.order_date).toLocaleDateString('ru-RU') : '—'}</td>
                    <td>${order.client_id.substring(0, 8)}...</td>
                    <td>${order.executor_id.substring(0, 8)}...</td>
                    <td>${order.total_amount || 0} ₽</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="viewOrder('${order.sales_order_id}')">👁️</button>
                        <button class="btn btn-sm btn-success" onclick="calculateCost('${order.sales_order_id}')">💰</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить данные');
        }
    }

    function openAddOrderModal() {
        document.getElementById('modalTitle').textContent = 'Добавить заказ';
        document.getElementById('editOrderId').value = '';
        document.getElementById('orderForm').reset();
        document.getElementById('orderDate').valueAsDate = new Date();
        openModal('orderModal');
    }

    async function viewOrder(orderId) {
        try {
            const response = await fetch(`/api/sales-orders/${orderId}`, { credentials: 'include' });
            const data = await response.json();
            const order = data.sales_order;
            let itemsHtml = '';
            if (order.items && order.items.length > 0) {
                itemsHtml = '<h4 style="margin-top: 16px; margin-bottom: 8px;">Товары в заказе:</h4><ul style="list-style: none; padding: 0;">';
                order.items.forEach(item => {
                    itemsHtml += `<li style="padding: 8px; border-bottom: 1px solid var(--color-border);">
                        Товар: ${item.product_id.substring(0, 8)}... | 
                        Кол-во: ${item.quantity} | 
                        Цена: ${item.unit_price} ₽ | 
                        Скидка: ${item.discount}%
                    </li>`;
                });
                itemsHtml += '</ul>';
            }

            const modalBody = document.querySelector('#orderModal .modal-body');
            modalBody.innerHTML = `
                <p><strong>Номер:</strong> ${order.order_number}</p>
                <p><strong>Дата:</strong> ${order.order_date ? new Date(order.order_date).toLocaleDateString('ru-RU') : '—'}</p>
                <p><strong>Клиент:</strong> ${order.client_id.substring(0, 8)}...</p>
                <p><strong>Исполнитель:</strong> ${order.executor_id.substring(0, 8)}...</p>
                <p><strong>Общая сумма:</strong> ${order.total_amount || 0} ₽</p>
                ${itemsHtml}
            `;
            
            document.getElementById('modalTitle').textContent = 'Информация о заказе';
            openModal('orderModal');
            
            document.getElementById('orderForm').style.display = 'none';
            const footer = document.querySelector('#orderModal .modal-footer');
            footer.innerHTML = '<button class="btn btn-primary" onclick="closeModal(\'orderModal\'); resetOrderModal();">Закрыть</button>';
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось загрузить заказ');
        }
    }

    function resetOrderModal() {
        document.getElementById('orderForm').style.display = 'block';
        document.getElementById('orderForm').reset();
        document.getElementById('orderDate').valueAsDate = new Date();
    }

    async function calculateCost(orderId) {
        try {
            const response = await fetch(`/api/sales-orders/${orderId}/cost-calculation`, { credentials: 'include' });
            const data = await response.json();
            const result = data.result;
            let itemsHtml = '<h4 style="margin-top: 16px;">Расчёт стоимости:</h4><table style="width: 100%; margin-top: 8px;"><thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Итого</th></tr></thead><tbody>';
            
            if (result.items) {
                result.items.forEach(item => {
                    itemsHtml += `<tr>
                        <td>${item.product_id.substring(0, 8)}...</td>
                        <td>${item.quantity}</td>
                        <td>${item.unit_price} ₽</td>
                        <td>${item.item_total} ₽</td>
                    </tr>`;
                });
            }
            itemsHtml += '</tbody></table>';
            itemsHtml += `<p style="margin-top: 16px;"><strong>Итого: ${result.total_amount} ₽</strong></p>`;

            const modalBody = document.querySelector('#orderModal .modal-body');
            modalBody.innerHTML = itemsHtml;
            
            document.getElementById('modalTitle').textContent = 'Расчёт стоимости заказа';
            openModal('orderModal');
            
            document.getElementById('orderForm').style.display = 'none';
            const footer = document.querySelector('#orderModal .modal-footer');
            footer.innerHTML = '<button class="btn btn-primary" onclick="closeModal(\'orderModal\'); resetOrderModal();">Закрыть</button>';
        } catch (error) {
            showNotification('error', 'Ошибка', 'Не удалось рассчитать стоимость');
        }
    }

    async function saveOrder(event) {
        event.preventDefault();
        const data = {
            order_number: document.getElementById('orderNumber').value,
            order_date: document.getElementById('orderDate').value,
            client_id: document.getElementById('orderClientId').value,
            executor_id: document.getElementById('orderExecutorId').value
        };

        try {
            const response = await fetch('/api/sales-orders/', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Error');
            showNotification('success', 'Успех', result.message || 'Заказ создан');
            closeModal('orderModal');
            loadOrders();
        } catch (error) {
            showNotification('error', 'Ошибка', error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
</script>
<div class="data-table">
    <div class="table-header">
        <div class="table-title">Список заказов</div>
        <div class="table-actions">
            <button class="btn btn-primary" onclick="openAddOrderModal()">+ Добавить заказ</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>№ заказа</th>
                <th>Дата</th>
                <th>Клиент ID</th>
                <th>Исполнитель ID</th>
                <th>Сумма</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="ordersTableBody">
            <tr><td colspan="6" class="loading-spinner">Загрузка...</td></tr>
        </tbody>
    </table>
</div>

<div id="orderModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">Добавить заказ</h3>
            <button class="modal-close" onclick="closeModal('orderModal')">&times;</button>
        </div>
        <form id="orderForm" onsubmit="saveOrder(event)">
            <input type="hidden" id="editOrderId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Номер заказа <span class="required">*</span></label>
                    <input type="text" id="orderNumber" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Дата заказа <span class="required">*</span></label>
                    <input type="date" id="orderDate" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Клиент ID <span class="required">*</span></label>
                    <input type="text" id="orderClientId" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Исполнитель ID <span class="required">*</span></label>
                    <input type="text" id="orderExecutorId" class="form-input" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('orderModal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
